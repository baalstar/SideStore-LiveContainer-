name: Build LiveContainer+SideStore
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6.0'
      - run: brew install ldid xcbeautify
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            dist/diagnostics.zip
            dist/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore
          path: dist/LiveContainer+SideStore.ipa
